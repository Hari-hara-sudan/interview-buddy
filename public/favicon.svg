<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="vmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle (subtle) -->
  <circle cx="256" cy="256" r="256" fill="#F8FAFC"/>
  
  <!-- VM Logo Group -->
  <g transform="translate(256, 256)">
    <!-- V Letter -->
    <path d="M -80 -90 L -20 100 L 0 100 L -60 -90 Z" 
          fill="url(#vmGradient)" 
          stroke="none"/>
    
    <!-- M Letter -->
    <path d="M 30 -90 L 30 100 M 30 -90 L 90 20 L 150 -90 M 150 -90 L 150 100" 
          stroke="url(#vmGradient)" 
          stroke-width="28" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Accent dot (small circle between V and M) -->
    <circle cx="-5" cy="-75" r="8" fill="#818CF8" opacity="0.9"/>
  </g>
</svg>